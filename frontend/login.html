<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Wanderly</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Wanderly ✈️</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <main class="container">

        <div class="hero">
            <h1>Welcome Back ✈️</h1>
            <p>Login to continue your journey.</p>
        </div>

        <form id="login-form">

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="login-message"></p>

    </main>

    <script src="js/login.js"></script>


    <footer class="footer">

    <div class="footer-logo">
        Wanderly ✈️
    </div>

    <p>
        Discover places. Share experiences. Find your next escape.
    </p>

    <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="create-post.html">Create Post</a>
        <a href="profile.html">Profile</a>
    </div>

    <p class="footer-copy">
        © 2026 Wanderly. All rights reserved.
    </p>

</footer>

</body>
</html>
