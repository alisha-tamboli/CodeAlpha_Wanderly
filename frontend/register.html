<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Wanderly</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">Wanderly ✈️</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </div>

</nav>

<main class="container">

    <div class="hero">
        <h1>Join Wanderly ✈️</h1>
        <p>Create your account and start sharing your journeys.</p>
    </div>

    <form id="register-form">

        <label>Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <label>Username</label>
        <input
            type="text"
            id="username"
            placeholder="Choose a username"
            required
        >

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">Create Account ✈️</button>

    </form>

    <p id="register-message"></p>

</main>

<script src="js/register.js"></script>

<footer class="footer">

    <div class="footer-logo">
        Wanderly ✈️
    </div>

    <p>
        Discover places. Share experiences. Find your next escape.
    </p>

    <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="create-post.html">Create Post</a>
        <a href="profile.html">Profile</a>
    </div>

    <p class="footer-copy">
        © 2026 Wanderly. All rights reserved.
    </p>

</footer>


</body>
</html>
